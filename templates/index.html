<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ücretsiz Transkript</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-ad-seconds="{{ ad_seconds }}" data-max-mb="{{ max_mb }}">
  <main class="wrap">
    <h1>Ücretsiz Transkript</h1>
    <p class="sub">Video veya ses dosyanı yükle, yazıya dökelim.</p>

    <!-- Reklam: üst banner. Reklam ağının kodunu bu kutunun içine koyun. -->
    <div class="ad ad-banner" data-ad-slot="top">Reklam</div>

    <section id="form" class="card">
      <label id="drop" class="drop">
        <input type="file" id="file" accept="audio/*,video/*">
        <span id="fileName">Dosya seç veya buraya sürükle</span>
        <small>En fazla {{ max_mb }} MB</small>
      </label>

      <select id="language" aria-label="Dil">
        <option value="auto">Dili otomatik algıla</option>
        <option value="tr">Türkçe</option>
        <option value="en">İngilizce</option>
        <option value="de">Almanca</option>
        <option value="fr">Fransızca</option>
        <option value="es">İspanyolca</option>
        <option value="it">İtalyanca</option>
        <option value="pt">Portekizce</option>
        <option value="nl">Felemenkçe</option>
        <option value="ru">Rusça</option>
        <option value="uk">Ukraynaca</option>
        <option value="pl">Lehçe</option>
        <option value="ar">Arapça</option>
        <option value="fa">Farsça</option>
        <option value="he">İbranice</option>
        <option value="az">Azerbaycanca</option>
        <option value="kk">Kazakça</option>
        <option value="uz">Özbekçe</option>
        <option value="zh">Çince</option>
        <option value="ja">Japonca</option>
        <option value="ko">Korece</option>
        <option value="hi">Hintçe</option>
        <option value="el">Yunanca</option>
        <option value="sv">İsveççe</option>
        <option value="cs">Çekçe</option>
        <option value="ro">Romence</option>
        <option value="bg">Bulgarca</option>
        <option value="vi">Vietnamca</option>
        <option value="id">Endonezce</option>
      </select>

      <button id="startBtn" class="btn">Başla</button>
    </section>

    <section id="progress" class="card" hidden>
      <div class="bar"><div id="barFill"></div></div>
      <p class="muted"><span id="percent">%0</span> · <span class="jobName"></span></p>
    </section>

    <p id="error" class="error" hidden></p>

    <!-- Reklam: sonuç öncesi banner -->
    <div class="ad ad-banner" data-ad-slot="before-result">Reklam</div>

    <section id="result" class="card" hidden>
      <p class="muted">İş adı: <b class="jobName"></b></p>
      <textarea id="text" readonly></textarea>
      <div class="row">
        <button id="copyBtn" class="btn small">Kopyala</button>
        <a id="dlTxt" class="btn small ghost" download>TXT</a>
        <a id="dlSrt" class="btn small ghost" download>SRT</a>
        <a id="dlVtt" class="btn small ghost" download>VTT</a>
      </div>
      <button id="againBtn" class="btn ghost">Yeni dosya</button>
    </section>
  </main>

  <!-- Tam ekran reklam (telefon uygulamalarındaki gibi) -->
  <div id="interstitial" class="overlay" hidden>
    <div class="overlay-top">
      <span class="tag">Reklam</span>
      <span id="adCount" class="count"></span>
      <button id="adClose" class="close" hidden aria-label="Kapat">✕</button>
    </div>
    <!-- Reklam: tam ekran. Video/görsel reklam kodunu bu kutunun içine koyun. -->
    <div class="ad ad-full" data-ad-slot="interstitial">Reklam</div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

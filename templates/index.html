<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vosk Transkripsiyon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #logs, #preview {
      font-family: monospace;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    #logs { max-height: 200px; }
    #preview { max-height: 320px; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-2xl mx-4 sm:mx-auto p-6 bg-white rounded-xl shadow-md mt-10">
    <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Vosk ile Transkripsiyon</h2>

    <label for="fileInput" class="block mb-2 font-medium">Video veya Ses Dosyası <span class="text-sm text-gray-500">(en fazla {{ max_upload_mb }} MB)</span></label>
    <input type="file" id="fileInput" accept="video/*,audio/*" class="mb-4 w-full border border-gray-300 p-2 rounded" />

    <label for="languageSelect" class="block mb-2 font-medium">Dil Seçin:</label>
    <select id="languageSelect" class="mb-4 w-full border border-gray-300 p-2 rounded">
      {% for group, langs in language_groups %}
      <optgroup label="{{ group }}">
        {% for code, name in langs %}
        <option value="{{ code }}">{{ name }} ({{ code }})</option>
        {% endfor %}
      </optgroup>
      {% endfor %}
    </select>

    <button id="submitBtn" onclick="submitForm()" class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-semibold py-2 px-4 rounded">Gönder</button>

    <progress id="progressBar" value="0" max="100" class="w-full h-4 mt-6 hidden"></progress>

    <h3 class="mt-6 font-semibold">İşlem Durumu:</h3>
    <div id="logs" class="p-3 mt-2 bg-gray-100 border border-gray-300 rounded" aria-live="polite"></div>

    <div id="result" class="hidden mt-6">
      <div class="flex gap-2 mb-3">
        <a id="downloadTxt" class="flex-1 text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded">TXT indir</a>
        <a id="downloadSrt" class="flex-1 text-center bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 rounded">SRT (altyazı) indir</a>
      </div>
      <div id="preview" class="p-3 bg-gray-50 border border-gray-300 rounded"></div>
    </div>
  </div>

  <script>
    const logsDiv = document.getElementById('logs');
    const progressBar = document.getElementById('progressBar');
    const submitBtn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');

    function setLog(message) {
      logsDiv.textContent = message;
    }

    function finish(message) {
      setLog(message);
      submitBtn.disabled = false;
    }

    function submitForm() {
      const fileInput = document.getElementById('fileInput');
      const selectedLanguage = document.getElementById('languageSelect').value;

      resultDiv.classList.add('hidden');
      if (!fileInput.files.length || !selectedLanguage) {
        setLog("Dosya ve dil seçimi zorunlu.");
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('option', selectedLanguage);

      submitBtn.disabled = true;
      progressBar.classList.remove('hidden');
      progressBar.value = 0;

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload", true);
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          const percent = Math.round(e.loaded * 100 / e.total);
          progressBar.value = percent;
          setLog(`Dosya yükleniyor: %${percent}`);
        }
      };
      xhr.onload = function () {
        let response = {};
        try { response = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200) {
          followProgress(response.job_id);
        } else {
          finish(response.error || "Yükleme sırasında bir hata oluştu.");
        }
      };
      xhr.onerror = function () {
        finish("Sunucuya erişilemedi.");
      };
      xhr.send(formData);
    }

    function followProgress(jobId) {
      progressBar.value = 0;
      setLog("Sırada bekleniyor...");
      const eventSource = new EventSource(`/progress/${encodeURIComponent(jobId)}`);
      eventSource.onmessage = function (event) {
        const state = JSON.parse(event.data);
        if (state.status === 'done') {
          eventSource.close();
          progressBar.value = 100;
          finish("İşlem tamamlandı.");
          showResult(jobId);
        } else if (state.status === 'error') {
          eventSource.close();
          finish(`Hata: ${state.error}`);
        } else if (state.status === 'running') {
          progressBar.value = state.progress;
          setLog(`Transkripsiyon ilerliyor: %${state.progress}`);
        }
      };
      eventSource.onerror = function () {
        // Bağlantı koparsa tarayıcı otomatik yeniden bağlanır; iş sunucuda devam eder
        setLog("Bağlantı koptu, yeniden bağlanılıyor...");
      };
    }

    function showResult(jobId) {
      const base = `/download/${encodeURIComponent(jobId)}`;
      document.getElementById('downloadTxt').href = `${base}?format=txt`;
      document.getElementById('downloadSrt').href = `${base}?format=srt`;
      fetch(`${base}?format=txt&inline=1`)
        .then(res => res.ok ? res.text() : Promise.reject())
        .then(text => {
          document.getElementById('preview').textContent = text.trim() || "(Konuşma algılanmadı)";
          resultDiv.classList.remove('hidden');
        })
        .catch(() => setLog("Sonuç alınamadı. Lütfen tekrar deneyin."));
    }
  </script>
</body>
</html>
